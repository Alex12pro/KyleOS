<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyle OS Gateway</title>
  <link rel="icon" href="./assets/logo.png" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070d;
      --panel: rgba(10, 18, 30, .88);
      --line: rgba(125, 211, 252, .28);
      --text: #f5fbff;
      --muted: #93a7bb;
      --accent: #55d6ff;
      --danger: #ff6b88;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 12%, rgba(85, 214, 255, .22), transparent 24%),
        linear-gradient(145deg, #05070d, #0a1724 58%, #04060b);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(125, 211, 252, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 211, 252, .04) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .85), transparent);
    }

    main {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .42);
      padding: 28px;
      position: relative;
    }

    header {
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
      margin-bottom: 22px;
    }

    img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(85, 214, 255, .34));
    }

    h1 {
      margin: 0;
      font-size: 1.65rem;
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: .95rem;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(2, 7, 14, .9);
      color: var(--text);
      font: inherit;
      font-size: 1.35rem;
      font-weight: 850;
      letter-spacing: .26em;
      text-align: center;
      outline: none;
      padding: 0 14px;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(85, 214, 255, .16);
    }

    button {
      height: 46px;
      border: 1px solid rgba(85, 214, 255, .5);
      border-radius: 8px;
      background: rgba(85, 214, 255, .14);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .error {
      min-height: 20px;
      color: var(--danger);
      font-size: .86rem;
      text-align: center;
    }

    @media (max-width: 420px) {
      main {
        padding: 22px;
      }

      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="./assets/logo.png" alt="">
      <h1>Kyle OS Gateway</h1>
      <p>Enter the access code to continue.</p>
    </header>

    <form id="gateway-form" autocomplete="off">
      <label for="gateway-code">Access code</label>
      <input id="gateway-code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus>
      <button type="submit">Enter</button>
      <div class="error" id="gateway-error" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.querySelector("#gateway-form");
    const code = document.querySelector("#gateway-code");
    const error = document.querySelector("#gateway-error");

    if (sessionStorage.getItem("kyleos:gateway") === "unlocked") {
      window.location.replace("./site.html");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (code.value.trim() === "0916") {
        sessionStorage.setItem("kyleos:gateway", "unlocked");
        window.location.href = "./site.html";
        return;
      }

      error.textContent = "Incorrect code.";
      code.value = "";
      code.focus();
    });
  </script>
</body>
</html>
