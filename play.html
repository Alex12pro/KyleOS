<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyle OS</title>
  <script>
    if (sessionStorage.getItem("kyleos:gateway") !== "unlocked") {
      window.location.replace("./index.html");
    }
  </script>
  <link rel="icon" href="./assets/logo.png" type="image/png">
  <link rel="stylesheet" href="./play.css">
</head>
<body>
  <div class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="./site.html" aria-label="Back to main menu" title="Back to main menu">
        <span aria-hidden="true">←</span>
      </a>

      <h1 id="game-title">Game</h1>

      <div class="game-actions">
        <button class="icon-button" id="refresh" type="button" aria-label="Refresh game" title="Refresh game">
          <span aria-hidden="true">↻</span>
        </button>
        <button class="icon-button" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">
          <span aria-hidden="true">⛶</span>
        </button>
      </div>
    </header>

    <iframe id="game-frame" title="Game" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe>
  </div>

  <script src="./shard-origins.js"></script>
  <script src="./play.js"></script>
</body>
</html>
